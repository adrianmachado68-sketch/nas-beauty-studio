<!DOCTYPE html>
<html lang="es-CR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light only">
<title>NÄS Beauty Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Jost:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
/* ============================================================
   NÄS Beauty Studio — demo de agenda
   Un solo archivo. Sin build. Persistencia en localStorage.
   ============================================================ */
:root{
  --taupe:#B5AC9C;
  --crema:#F5F1EA;
  --marron:#8C7259;
  --marron-claro:#A88B6D;
  --texto:#3D3630;
  --blanco:#FFFFFF;

  --tenue:#6E645A;      /* etiquetas chiquitas y datos secundarios */
  --lectura:#4E463D;    /* textos para leer: políticas, notas, explicaciones */
  --linea:rgba(140,114,89,.18);
  --linea-fuerte:rgba(140,114,89,.32);
  --suave:#EFE9E1;
  --arena:#E4DCD0;
  --ok:#6F8467;
  --alerta:#A9704F;

  --serif:'Cormorant Garamond','Playfair Display',Georgia,'Times New Roman',serif;
  --sans:'Jost','Century Gothic',Futura,'Segoe UI',system-ui,-apple-system,sans-serif;

  --r:18px;
  --r-sm:12px;
  --sombra:0 1px 2px rgba(61,54,48,.03), 0 10px 30px rgba(61,54,48,.07);
  --sombra-sm:0 1px 2px rgba(61,54,48,.04), 0 4px 14px rgba(61,54,48,.05);
}
/* La página es clara a propósito. Sin esto, Chrome en Android la "oscurece"
   solo y deja los textos en gris. */
:root{color-scheme:only light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--crema);-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0;padding:0}
body{
  font-family:var(--sans);
  font-weight:300;
  color:var(--texto);
  background-color:var(--crema);            /* base sólida: si el degradado no pinta, el fondo sigue claro */
  background-image:linear-gradient(175deg,#FCFAF7 0%,var(--crema) 38%,#E7DFD3 100%);
  background-attachment:fixed;
  min-height:100vh;
  font-size:15px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--serif);font-weight:400;margin:0;letter-spacing:.01em}
/* Sin un color explícito, Safari en iPhone pinta el texto de los botones con
   el azul de acento del sistema. En la computadora no se nota. */
button{font-family:var(--sans);font-weight:300;cursor:pointer;color:var(--texto);-webkit-appearance:none;appearance:none}
button h1,button h2,button h3,button h4,button span,button div,button i{color:inherit}
input,select,textarea{font-family:var(--sans);font-weight:300;color:var(--texto)}
a{color:var(--marron);text-decoration:none}

/* ---------- marco ---------- */
.marco{max-width:440px;margin:0 auto;min-height:100vh;position:relative;background:rgba(255,255,255,.42);box-shadow:0 0 60px rgba(61,54,48,.06)}
.marco.ancho{max-width:760px}
.cuerpo{padding:0 22px 150px}
.cuerpo.sin-barra{padding-bottom:40px}
.cita-enc .h{white-space:nowrap}

/* ---------- encabezado ---------- */
.enc{position:sticky;top:0;z-index:40;padding:16px 22px 14px;background:linear-gradient(180deg,rgba(245,241,234,.97),rgba(245,241,234,.86));backdrop-filter:blur(10px);border-bottom:1px solid var(--linea);display:flex;align-items:center;gap:13px}
.logo{width:46px;height:46px;border-radius:50%;object-fit:cover;flex:0 0 auto;box-shadow:0 2px 10px rgba(61,54,48,.12);background:var(--taupe)}
.logo-fallback{width:46px;height:46px;border-radius:50%;background:var(--taupe);color:#fff;display:none;align-items:center;justify-content:center;font-family:var(--serif);font-size:19px;letter-spacing:.02em;flex:0 0 auto}
.marca .n{font-family:var(--serif);font-size:25px;line-height:1;letter-spacing:.11em;color:var(--texto)}
.marca .s{font-size:8.5px;letter-spacing:.34em;text-transform:uppercase;color:var(--tenue);margin-top:5px}
.enc .der{margin-left:auto;text-align:right;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--tenue)}

/* ---------- hero ---------- */
.hero{position:relative;padding:34px 22px 26px;text-align:center;overflow:hidden}
.hero h1{font-size:31px;line-height:1.16;font-weight:300;letter-spacing:.005em}
.hero h1 em{font-style:italic;color:var(--marron)}
.hero p{margin:11px auto 0;max-width:300px;font-size:13.5px;color:var(--lectura);line-height:1.65}
.rama{position:absolute;pointer-events:none;color:var(--marron);opacity:.15}
.rama.izq{left:-46px;top:-8px;width:150px;transform:rotate(-8deg)}
.rama.der{right:-52px;bottom:-30px;width:165px;transform:scaleX(-1) rotate(-14deg)}

/* ---------- pasos ---------- */
.pasos{display:flex;align-items:center;gap:6px;padding:4px 22px 0;max-width:440px;margin:0 auto}
.pasos .p{height:2px;flex:1;background:var(--arena);border-radius:2px;overflow:hidden}
.pasos .p i{display:block;height:100%;width:0;background:var(--marron-claro);transition:width .45s ease}
.pasos .p.on i,.pasos .p.hecho i{width:100%}
.paso-tit{padding:14px 22px 0;max-width:440px;margin:0 auto;display:flex;align-items:baseline;gap:10px}
.paso-tit .num{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--marron-claro);white-space:nowrap}
.paso-tit h2{font-size:24px;font-weight:300}

/* ---------- tarjetas ---------- */
.card{background:var(--blanco);border:1px solid var(--linea);border-radius:var(--r);padding:16px;box-shadow:var(--sombra-sm)}
.card+.card{margin-top:10px}
.card.sel{border-color:var(--marron);background:linear-gradient(180deg,#fff,#FBF7F1);box-shadow:0 2px 4px rgba(140,114,89,.06),0 10px 26px rgba(140,114,89,.13)}
.serv{display:flex;gap:14px;align-items:flex-start;text-align:left;width:100%;background:var(--blanco);border:1px solid var(--linea);border-radius:var(--r);padding:15px 16px;box-shadow:var(--sombra-sm);transition:border-color .2s,box-shadow .2s,transform .12s}
.serv:active{transform:scale(.995)}
.serv .marca-sel{width:20px;height:20px;border-radius:50%;border:1px solid var(--linea-fuerte);flex:0 0 auto;margin-top:2px;display:flex;align-items:center;justify-content:center}
.serv.sel{border-color:var(--marron);background:linear-gradient(180deg,#fff,#FBF7F1);box-shadow:0 2px 4px rgba(140,114,89,.06),0 10px 26px rgba(140,114,89,.13)}
.serv.sel .marca-sel{background:var(--marron);border-color:var(--marron)}
.serv.sel .marca-sel svg{display:block}
.serv .marca-sel svg{display:none;width:11px;height:11px;stroke:#fff;stroke-width:2.4;fill:none}
.serv .nom{font-family:var(--serif);font-size:18.5px;line-height:1.25;letter-spacing:.005em}
.serv .meta{margin-top:5px;font-size:12px;color:var(--lectura);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.serv .precio{margin-left:auto;font-size:15px;letter-spacing:.02em;white-space:nowrap;padding-top:2px}
.serv[disabled]{opacity:.4}

.punto{width:3px;height:3px;border-radius:50%;background:var(--taupe);display:inline-block}
.tag{font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--marron-claro);border:1px solid var(--linea);border-radius:20px;padding:2px 7px;white-space:nowrap}
.tag.aviso{color:var(--alerta);border-color:rgba(169,112,79,.3)}

.nota{font-size:12.5px;color:var(--lectura);line-height:1.6}
.nota-caja{background:rgba(181,172,156,.16);border:1px solid var(--linea);border-radius:var(--r-sm);padding:12px 14px;font-size:13px;color:var(--lectura);font-weight:400;line-height:1.65}
.sep{height:1px;background:var(--linea);margin:14px 0}
.rot{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--marron-claro);margin:22px 0 10px}
.rot:first-child{margin-top:0}

/* ---------- adicionales ---------- */
.add{display:flex;gap:13px;align-items:center;width:100%;text-align:left;background:var(--blanco);border:1px solid var(--linea);border-radius:var(--r);padding:14px 15px;box-shadow:var(--sombra-sm)}
.add+.add{margin-top:9px}
.add.sel{border-color:var(--marron);background:linear-gradient(180deg,#fff,#FBF7F1)}
.caja{width:19px;height:19px;border-radius:5px;border:1px solid var(--linea-fuerte);flex:0 0 auto;display:flex;align-items:center;justify-content:center;background:#fff}
.add.sel .caja{background:var(--marron);border-color:var(--marron)}
.add .caja svg{display:none;width:11px;height:11px;stroke:#fff;stroke-width:2.6;fill:none}
.add.sel .caja svg{display:block}
.add .nom{font-size:14px}
.add .meta{font-size:11.5px;color:var(--lectura);margin-top:2px}
.cont{display:flex;align-items:center;gap:0;margin-left:auto;border:1px solid var(--linea);border-radius:22px;overflow:hidden;background:#fff}
.cont button{width:32px;height:30px;border:0;background:transparent;font-size:15px;color:var(--marron);line-height:1}
.cont span{min-width:26px;text-align:center;font-size:13px}

/* ---------- calendario ---------- */
.cal-enc{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-enc h3{font-size:20px;font-weight:400}
.flecha{width:34px;height:34px;border-radius:50%;border:1px solid var(--linea);background:#fff;display:flex;align-items:center;justify-content:center;color:var(--marron)}
.flecha[disabled]{opacity:.3}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dow{text-align:center;font-size:9.5px;letter-spacing:.12em;color:var(--tenue);padding-bottom:6px;text-transform:uppercase}
.dia{aspect-ratio:1;border:1px solid transparent;border-radius:50%;background:#fff;box-shadow:var(--sombra-sm);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:14px;gap:3px;padding:0;color:var(--texto)}
.dia i{width:3px;height:3px;border-radius:50%;background:var(--marron-claro);display:block}
.dia[disabled]{background:transparent;box-shadow:none;color:rgba(61,54,48,.24)}
.dia.sel{background:var(--marron);color:#fff;box-shadow:0 4px 14px rgba(140,114,89,.35)}
.dia.sel i{background:rgba(255,255,255,.8)}
.dia.hoy:not(.sel){border-color:var(--linea-fuerte)}

/* ---------- horas ---------- */
.horas{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hora{padding:13px 4px;border:1px solid var(--linea);border-radius:var(--r-sm);background:#fff;font-size:14.5px;letter-spacing:.03em;box-shadow:var(--sombra-sm)}
.hora.sel{background:var(--marron);color:#fff;border-color:var(--marron)}

/* ---------- campos ---------- */
.campo{margin-bottom:14px}
.campo label{display:block;font-size:9.5px;letter-spacing:.17em;text-transform:uppercase;color:var(--tenue);margin-bottom:6px}
.inp{width:100%;padding:13px 14px;border:1px solid var(--linea);border-radius:var(--r-sm);background:#fff;font-size:15px;outline:none;transition:border-color .18s}
.inp:focus{border-color:var(--marron-claro)}
.inp.mal{border-color:var(--alerta);background:#FDF7F4}
select.inp{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' fill='none' stroke='%238C7259'><path d='M1 1l4 4 4-4'/></svg>");background-repeat:no-repeat;background-position:right 14px center}
.dos{display:flex;gap:9px}
.dos .pais{flex:0 0 116px}
.err{font-size:11.5px;color:var(--alerta);margin-top:5px}

/* ---------- botones ---------- */
.btn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;padding:15px;border:0;border-radius:40px;background:var(--marron);color:#fff;font-size:14px;letter-spacing:.09em;text-transform:uppercase;box-shadow:0 4px 16px rgba(140,114,89,.28);transition:transform .12s,opacity .2s}
.btn:active{transform:scale(.985)}
.btn[disabled]{background:var(--taupe);box-shadow:none;opacity:.55}
.btn.sec{background:#fff;color:var(--marron);border:1px solid var(--linea-fuerte);box-shadow:none}
.btn.min{padding:11px 16px;width:auto;font-size:11px;letter-spacing:.11em}
.btn.wa{background:var(--ok);box-shadow:0 4px 16px rgba(111,132,103,.3)}
.txt-btn{background:transparent;border:0;color:var(--tenue);font-size:12px;letter-spacing:.06em;padding:10px;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--linea-fuerte)}

/* ---------- barra inferior ---------- */
.barra{position:fixed;bottom:0;left:0;right:0;z-index:45;background:linear-gradient(180deg,rgba(245,241,234,.72),rgba(245,241,234,.98) 40%);backdrop-filter:blur(12px);border-top:1px solid var(--linea);padding:12px 22px calc(14px + env(safe-area-inset-bottom))}
.barra .in{max-width:440px;margin:0 auto}
.barra{transition:transform .3s ease,opacity .3s ease}
.barra.oculta{transform:translateY(105%);opacity:0;pointer-events:none}

.resumen-min{display:flex;align-items:baseline;gap:9px;margin-bottom:10px;font-size:12px;color:var(--tenue)}
.resumen-min b{font-family:var(--serif);font-size:20px;font-weight:500;color:var(--texto);letter-spacing:.01em}
.resumen-min .atras{margin-left:auto}

/* ---------- resumen / depósito ---------- */
.lin{display:flex;gap:12px;font-size:13.5px;padding:5px 0}
.lin .v{margin-left:auto;white-space:nowrap;letter-spacing:.02em}
.lin.sub{font-size:12px;color:var(--lectura)}
.lin.tot{font-size:15px;padding-top:11px;margin-top:6px;border-top:1px solid var(--linea)}
.lin.tot .v{font-family:var(--serif);font-size:22px;font-weight:500}

.dep{background:linear-gradient(165deg,#fff 0%,#FAF6F0 55%,#F1E9DD 100%);border:1px solid var(--linea-fuerte);border-radius:var(--r);padding:20px 18px;text-align:center;box-shadow:var(--sombra);position:relative;overflow:hidden}
.dep .et{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--marron-claro)}
.dep .monto{font-family:var(--serif);font-size:44px;line-height:1.1;margin:6px 0 2px;letter-spacing:.01em}
.dep .det{font-size:12px;color:var(--lectura)}
.sinpe{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--linea);border-radius:var(--r-sm);padding:12px 14px;margin-top:14px;text-align:left}
.sinpe .k{font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--tenue)}
.sinpe .n{font-family:var(--serif);font-size:22px;letter-spacing:.05em;line-height:1.2}
.copiar{margin-left:auto;border:1px solid var(--linea-fuerte);background:#fff;color:var(--marron);border-radius:30px;padding:9px 14px;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;display:flex;align-items:center;gap:7px;white-space:nowrap}

.reloj{display:flex;align-items:center;gap:13px;background:rgba(169,112,79,.09);border:1px solid rgba(169,112,79,.26);border-radius:var(--r-sm);padding:14px 15px}
.reloj .t{font-family:var(--serif);font-size:33px;letter-spacing:.03em;line-height:1;font-variant-numeric:tabular-nums;color:var(--alerta)}
.reloj .d{font-size:12.5px;line-height:1.5;color:var(--lectura);font-weight:400;margin-top:3px}
.reloj .d b{font-weight:400;color:var(--alerta)}
.reloj svg{width:18px;height:18px;stroke:var(--alerta);fill:none;stroke-width:1.3;flex:0 0 auto}

.adjunto{display:flex;align-items:center;gap:12px;border:1px dashed var(--linea-fuerte);border-radius:var(--r-sm);padding:13px 14px;background:#fff;width:100%;text-align:left;font-size:13px;color:var(--marron)}
.adjunto svg{width:17px;height:17px;stroke:var(--marron);fill:none;stroke-width:1.4}
.adjunto img{width:42px;height:42px;object-fit:cover;border-radius:8px}

/* ---------- confirmación ---------- */
.ok-sello{width:62px;height:62px;border-radius:50%;border:1px solid var(--linea-fuerte);background:#fff;display:flex;align-items:center;justify-content:center;margin:6px auto 16px;box-shadow:var(--sombra-sm)}
.ok-sello svg{width:24px;height:24px;stroke:var(--marron);fill:none;stroke-width:1.2}

/* ---------- estados ---------- */
.est{font-size:9px;letter-spacing:.14em;text-transform:uppercase;padding:3.5px 9px;border-radius:20px;white-space:nowrap;border:1px solid transparent}
.est.apartada{background:rgba(169,112,79,.12);color:var(--alerta);border-color:rgba(169,112,79,.24)}
.est.pendiente{background:rgba(168,139,109,.14);color:var(--marron);border-color:rgba(140,114,89,.24)}
.est.aprobada{background:rgba(111,132,103,.13);color:var(--ok);border-color:rgba(111,132,103,.26)}
.est.completada{background:rgba(61,54,48,.07);color:var(--tenue);border-color:rgba(61,54,48,.14)}
.est.rechazada,.est.cancelada,.est.expirada{background:transparent;color:#8B8378;border-color:var(--linea)}

/* ---------- panel ---------- */
.tabs{display:flex;gap:2px;padding:0 12px;overflow-x:auto;border-bottom:1px solid var(--linea);position:sticky;top:76px;background:rgba(245,241,234,.96);backdrop-filter:blur(10px);z-index:35}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:transparent;padding:14px 7px 12px;font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--tenue);border-bottom:1.5px solid transparent;white-space:nowrap;display:flex;align-items:center;gap:6px}
.tab.on{color:var(--marron);border-bottom-color:var(--marron)}
.tab .bola{background:var(--alerta);color:#fff;font-size:9px;min-width:16px;height:16px;border-radius:9px;display:flex;align-items:center;justify-content:center;letter-spacing:0;padding:0 4px}

.cita{background:#fff;border:1px solid var(--linea);border-radius:var(--r);padding:15px 16px;box-shadow:var(--sombra-sm);margin-bottom:10px}
.cita.urg{border-color:rgba(169,112,79,.4);box-shadow:0 2px 4px rgba(169,112,79,.05),0 10px 26px rgba(169,112,79,.12)}
.cita-enc{display:flex;align-items:flex-start;gap:10px}
.cita-enc .h{font-family:var(--serif);font-size:23px;line-height:1;letter-spacing:.02em;min-width:66px}
.cita-enc .nm{font-size:14.5px;line-height:1.3}
.cita-enc .sub{font-size:11.5px;color:var(--lectura);margin-top:3px}
.cita-enc .lado{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.cita .cuerpo-cita{margin-top:12px;padding-top:12px;border-top:1px solid var(--linea)}
.acc{display:flex;gap:7px;margin-top:13px;flex-wrap:wrap}
.acc .btn{flex:1;min-width:110px}
.mini{border:1px solid var(--linea-fuerte);background:#fff;color:var(--marron);border-radius:30px;padding:9px 14px;font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;display:inline-flex;align-items:center;gap:6px}
.mini.g{background:var(--ok);color:#fff;border-color:var(--ok)}
.mini.w{border-color:rgba(111,132,103,.45);color:var(--ok)}
.mini.w svg{width:13px;height:13px}
.mini.r{color:#A79E92;border-color:var(--linea);background:transparent;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--linea-fuerte)}
.thumb{width:100%;max-height:150px;object-fit:cover;border-radius:var(--r-sm);border:1px solid var(--linea);margin-top:10px;display:block}

.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:#fff;border:1px solid var(--linea);border-radius:var(--r-sm);padding:13px 12px;box-shadow:var(--sombra-sm)}
.kpi .k{font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--tenue)}
.kpi .v{font-family:var(--serif);font-size:21px;margin-top:4px;letter-spacing:.01em}
.kpi .s{font-size:10.5px;color:var(--tenue)}
.destacado{background:linear-gradient(160deg,#fff,#F6F1E9 60%,#EDE4D7);border:1px solid var(--linea-fuerte);border-radius:var(--r);padding:20px 18px;text-align:center;box-shadow:var(--sombra)}
.destacado .v{font-family:var(--serif);font-size:52px;line-height:1;margin:4px 0 6px}

.fab{position:fixed;z-index:46;right:calc(50% - 220px + 18px);bottom:calc(24px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:9px;background:var(--marron);color:#fff;border:0;border-radius:40px;padding:14px 20px;font-size:11.5px;letter-spacing:.11em;text-transform:uppercase;box-shadow:0 6px 22px rgba(140,114,89,.4)}
@media(max-width:800px){.fab{right:18px}}
.fab svg{width:14px;height:14px;stroke:#fff;stroke-width:1.6;fill:none}

/* ---------- modal ---------- */
.velo{position:fixed;inset:0;z-index:60;background:rgba(61,54,48,.42);backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center;padding:0}
.hoja-modal{background:var(--crema);width:100%;max-width:440px;max-height:92vh;overflow-y:auto;border-radius:22px 22px 0 0;padding:22px 22px calc(24px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px rgba(61,54,48,.2)}
.hoja-modal h3{font-size:22px;font-weight:400;margin-bottom:4px}
.hoja-modal .cerrar{position:absolute;top:0;right:0}

<script>
/* ============================================================
   1. Utilidades de fecha, hora y dinero  (zona America/Costa_Rica)
   ============================================================ */
const TZ = 'America/Costa_Rica';

function partesCR(d){
  try{
    const f = new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false});
    const p = {}; for(const x of f.formatToParts(d||new Date())) p[x.type]=x.value;
    const h = p.hour === '24' ? '00' : p.hour;
    return { ymd:p.year+'-'+p.month+'-'+p.day, min:(+h)*60 + (+p.minute) };
  }catch(e){ // respaldo si el navegador no soporta la zona
    const x = d||new Date();
    return { ymd:aYMD(x), min:x.getHours()*60 + x.getMinutes() };
  }
}
const hoyCR = () => partesCR().ymd;
const minCR  = () => partesCR().min;

function aYMD(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function deYMD(s){ return new Date(s+'T12:00:00Z'); }
function sumarDias(s,n){ const d=deYMD(s); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); }
function diaSemana(s){ return deYMD(s).getUTCDay(); }            // 0 = domingo
function inicioSemana(s){ const d=deYMD(s); const w=(d.getUTCDay()+6)%7; d.setUTCDate(d.getUTCDate()-w); return d.toISOString().slice(0,10); }

const DIAS   = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
const DIAS_C = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const MESES  = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','setiembre','octubre','noviembre','diciembre'];

function aMin(hhmm){ const [h,m]=hhmm.split(':').map(Number); return h*60+m; }
function aHora(min){ const h=Math.floor(min/60), m=min%60; return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0'); }
function hora12(min){
  const h=Math.floor(min/60), m=min%60;
  const ap = h<12 ? 'a.m.' : 'p.m.';
  let hh = h%12; if(hh===0) hh=12;
  return hh+':'+String(m).padStart(2,'0')+' '+ap;
}
function dur(min){
  const h=Math.floor(min/60), m=min%60;
  if(h===0) return m+' min';
  if(m===0) return h+' h';
  return h+' h '+m+' min';
}
function col(n){ return '₡'+Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,'.'); }
function fechaLarga(s){ const d=deYMD(s); return DIAS[d.getUTCDay()]+' '+d.getUTCDate()+' de '+MESES[d.getUTCMonth()]; }
function capital(s){ return s.charAt(0).toUpperCase()+s.slice(1); }
function fechaCorta(s){ const d=deYMD(s); return DIAS_C[d.getUTCDay()]+' '+d.getUTCDate()+' '+MESES[d.getUTCMonth()].slice(0,3); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ============================================================
   2. Datos base
   Precios reales de su lista publicada.
   Las duraciones con  todo:true  son estimaciones: ella las corrige
   desde Configuración (aparecen marcadas como "estimado").
   ============================================================ */
function datosIniciales(){
  return {
    servicios:[
      {id:'s1', nombre:'Esmaltado semipermanente liso',                 precio:10000, min:60},
      {id:'s2', nombre:'Esmaltado semipermanente + diseño básico',      precio:12000, min:75,  todo:true}, // TODO duración estimada
      {id:'s3', nombre:'Técnica balance',                               precio:13500, min:60},
      {id:'s4', nombre:'Técnica balance + semipermanente liso',          precio:15500, min:120},
      {id:'s5', nombre:'Técnica balance + semiperm. con diseño básico',  precio:17000, min:135, todo:true}, // TODO duración estimada
      {id:'s6', nombre:'Gel-X + semipermanente liso',                    precio:16500, min:120},
      {id:'s7', nombre:'Gel-X + semipermanente con diseño básico',       precio:18500, min:135, todo:true}, // TODO duración estimada
      {id:'s8', nombre:'Pedicure + semipermanente',                      precio:15000, min:60}
    ],
    adicionales:[
      {id:'a1', nombre:'Retiro de semipermanente',      precio:2500, min:15, todo:true}, // TODO duración estimada
      {id:'a2', nombre:'Retiro de Gel-X o rubber',      precio:4000, min:20, todo:true}, // TODO duración estimada
      {id:'a3', nombre:'Retiro de acrílico',            precio:6000, min:30, todo:true}, // TODO duración estimada
      {id:'a4', nombre:'Reconstrucción de uña',         precio:1000, min:5,  todo:true, porUnidad:true} // TODO duración estimada
    ],
    // TODO horarios provisionales: confirmar con Ariana
    horarios:{
      0:[],
      1:[{ini:'09:00',fin:'18:00'}],
      2:[{ini:'09:00',fin:'18:00'}],
      3:[{ini:'09:00',fin:'18:00'}],
      4:[{ini:'09:00',fin:'18:00'}],
      5:[{ini:'09:00',fin:'18:00'}],
      6:[{ini:'09:00',fin:'15:00'}]
    },
    fechasBloqueadas:[],
    config:{
      depositoPorServicio:7000,
      horasApartado:2,
      anticipacionMinima:240,   // minutos: nadie reserva para dentro de menos de 4 h
      diasAdelante:60,          // hasta cuándo se puede reservar
      maxApartados:2,           // apartados sin confirmar por persona
      pasoSlot:30,
      sinpe:'8737-8504',

    },

  };
}

/* ------------------------------------------------------------
   Mensajes que salen por WhatsApp hacia la clienta.
   TODO textos: Ariana los puede reescribir con su propio tono.
   Marcadores disponibles:
     {nombre} {dia} {hora} {servicios} {duracion}
     {total} {deposito} {resta} {sinpe}
   ------------------------------------------------------------ */
const MENSAJES_WA = {
  apartada:
    'Hola {nombre}, le escribo de NÄS Beauty Studio. Tengo apartado su espacio del {dia} a las {hora} para {servicios}. '+
    'Me falta el depósito de {deposito} por SINPE al {sinpe} para dejarlo confirmado. '+

  pendiente:
    'Hola {nombre}, le escribo de NÄS Beauty Studio. Ya recibí su comprobante del depósito para la cita del {dia} a las {hora}, '+
    'lo estoy revisando y le confirmo en un ratito.',
  aprobada:
    'Hola {nombre}, su cita quedó confirmada para el {dia} a las {hora}, para {servicios} ({duracion}). '+
    'El día de la cita se cancelan {resta}, porque el depósito de {deposito} ya está descontado. '+
    'La espero en Río Oro, Santa Ana. Hay estacionamiento gratis para clientas.',
  otro:
    'Hola {nombre}, le escribo de NÄS Beauty Studio por su cita del {dia} a las {hora}.'
};

const LLAVE = 'nas_agenda_demo_v1';
let S = null;

function guardar(){
  try{
    localStorage.setItem(LLAVE, JSON.stringify(S));
  }catch(e){
    console.warn('No se pudo guardar:', e.message);
    aviso('No se pudo guardar: el almacenamiento está lleno');
  }
}
function cargar(){
  try{
    const t = localStorage.getItem(LLAVE);
    if(!t) return null;
    const d = JSON.parse(t);
    if(!d || !d.servicios || !d.config) return null;
    return d;
  }catch(e){ return null; }
}
function reiniciar(){
  S = datosIniciales();
  sembrar();
  guardar();
}

const servicio  = id => S.servicios.find(s=>s.id===id);
const adicional = id => S.adicionales.find(a=>a.id===id);

/* ============================================================
   3. Reglas de agenda
   - Trabaja sola: nunca dos citas traslapadas.
   - Un servicio tiene que caber entero dentro de un bloque
     (por eso nada atraviesa la pausa de almuerzo).
   ============================================================ */
const BLOQUEAN = ['pendiente','aprobada','completada'];

function bloquea(c){
  if(c.estado === 'apartada') return c.apartadoHasta > Date.now();
  return BLOQUEAN.includes(c.estado);
}
function activa(c){ return bloquea(c); }

function liberarExpiradas(){
  let cambio = false;
  for(const c of S.citas){
    if(c.estado === 'apartada' && c.apartadoHasta <= Date.now()){
      c.estado = 'expirada';
      cambio = true;
    }
  }
  if(cambio) guardar();
  return cambio;
}

/* El apartado vence 15 min antes de la cita y nunca dura menos de 30 min útiles */
const COLCHON_CITA  = 15;
const APARTADO_MIN  = 30;

/* Minutos que faltan para el inicio de una cita */
function minutosHasta(fecha, inicioMin){
  const ahora = partesCR();
  const dias  = Math.round((deYMD(fecha) - deYMD(ahora.ymd)) / 86400000);
  return dias*1440 + inicioMin - ahora.min;
}

/* Cuándo vence el apartado de una cita: lo que pase primero entre
   las horas de apartado y 15 minutos antes de la cita. */
function finApartado(fecha, inicioMin){
  const tope = Date.now() + Math.max(0, minutosHasta(fecha, inicioMin) - COLCHON_CITA)*60000;
  return Math.min(Date.now() + S.config.horasApartado*3600*1000, tope);
}

/* Índice fecha -> tramos ocupados, para no recorrer todas las citas por día */
function indiceOcupado(excluir){
  const idx = {};
  for(const c of S.citas){
    if(c.id === excluir || !bloquea(c)) continue;
    (idx[c.fecha] = idx[c.fecha] || []).push([aMin(c.hora), aMin(c.hora) + c.duracion]);
  }
  return idx;
}

/* Espacios disponibles de un día para una duración dada.
   opc.incluirPasadas : sin filtro de tiempo (cita manual del panel)
   opc.admin          : sin anticipación mínima, pero nada en el pasado (mover cita)
   opc.indice         : índice de ocupación ya calculado
   Al público se le exige la anticipación mínima configurada y que el
   apartado alcance a durar algo: por eso el piso de 45 minutos. */
function espacios(fecha, duracion, opc){
  opc = opc || {};
  if(!duracion || duracion <= 0) return [];
  if(S.fechasBloqueadas.includes(fecha)) return [];
  const bloques = S.horarios[diaSemana(fecha)] || [];
  const ocupado = opc.indice
    ? (opc.indice[fecha] || [])
    : S.citas.filter(c => c.fecha === fecha && c.id !== opc.excluir && bloquea(c))
             .map(c => [aMin(c.hora), aMin(c.hora) + c.duracion]);
  const paso = S.config.pasoSlot || 30;

  let antic = null;                                   // minutos mínimos de anticipación
  if(!opc.incluirPasadas){
    antic = opc.admin ? 0
          : Math.max(S.config.anticipacionMinima || 0, COLCHON_CITA + APARTADO_MIN);
  }
  const esPublico = antic !== null && !opc.admin;
  // el público solo ve hasta donde llega la agenda abierta
  if(esPublico && fecha > sumarDias(hoyCR(), S.config.diasAdelante || 60)) return [];
  const ahora = partesCR();
  const dias  = Math.round((deYMD(fecha) - deYMD(ahora.ymd)) / 86400000);

  const out = [];
  for(const b of bloques){
    const bi = aMin(b.ini), bf = aMin(b.fin);
    for(let t = bi; t + duracion <= bf; t += paso){
      if(antic !== null && (dias*1440 + t - ahora.min) < antic) continue;
      if(ocupado.some(([s,e]) => t < e && t + duracion > s)) continue;
      out.push(t);
    }
  }
  return out.sort((a,b)=>a-b);
}
function chocaCon(fecha, inicio, duracion, excluir){
  return S.citas.some(c => c.fecha===fecha && c.id!==excluir && bloquea(c) &&
    inicio < aMin(c.hora)+c.duracion && inicio+duracion > aMin(c.hora));
}

/* ============================================================
   4. Estado de la vista
   ============================================================ */
let V = {

  acor:{},             // políticas abiertas
  paso:1,
  sel:[],            // ids de servicios principales (máx. 2)
  adic:{},           // id -> cantidad
  fecha:null,
  hora:null,
  mes:null,          // {y,m} del calendario
  cliente:{nombre:'',pais:'CR',tel:'',email:''},
  errores:{},
  citaId:null,       // cita apartada en curso
  comprobante:'',
  captura:null,
  admin:{ tab:'solicitudes', fecha:null, pinOk:false }
};

const PAISES = [
  {c:'CR', n:'Costa Rica', d:'+506', len:8},
  {c:'NI', n:'Nicaragua',  d:'+505', len:8},
  {c:'PA', n:'Panamá',     d:'+507', len:8},
  {c:'MX', n:'México',     d:'+52',  len:10},
  {c:'US', n:'Estados Unidos', d:'+1', len:10},
  {c:'ES', n:'España',     d:'+34',  len:9},
  {c:'CO', n:'Colombia',   d:'+57',  len:10}
];
const pais = c => PAISES.find(p=>p.c===c) || PAISES[0];

/* Cálculos del carrito */
function totalSel(){
  let precio = 0, minutos = 0;
  for(const id of V.sel){ const s = servicio(id); if(s){ precio += s.precio; minutos += s.min; } }
  for(const id in V.adic){
    const a = adicional(id), q = V.adic[id];
    if(a && q > 0){ precio += a.precio * q; minutos += a.min * q; }
  }
  return { precio, minutos, deposito: V.sel.length * S.config.depositoPorServicio };
}

/* ============================================================

const ICO = {
  check:'<svg viewBox="0 0 12 12"><path d="M1.5 6.5l3 3 6-7"/></svg>',

/* marca la sección visible en la barra de navegación */
function marcarNav(){
  if(V.pantalla !== 'inicio') return;
  const y = window.scrollY + 150;
  let act = SECCIONES[0].id;
  for(const s of SECCIONES){
    const el = document.getElementById(s.id);
    if(el && el.offsetTop <= y) act = s.id;
  }
  if(window.scrollY < 120) act = null;
  for(const b of document.querySelectorAll('[data-nav]'))
    b.classList.toggle('on', b.getAttribute('data-nav') === act);
  const cta = document.getElementById('cta-fija');
  if(cta) cta.classList.toggle('oculta', window.scrollY < 330);
}

   6. Pantalla de la clienta — flujo de reserva
   ============================================================ */
const PASOS = ['Servicio','Adicionales','Día','Hora','Datos','Depósito'];

function barraPasos(){
  let h = '<div class="pasos">';
  for(let i=1;i<=6;i++) h += '<div class="p '+(i<V.paso?'hecho':(i===V.paso?'on':''))+'"><i></i></div>';
  return h+'</div>';
}
function tituloPaso(t){
  return '<div class="paso-tit"><div class="num">'+V.paso+' / 6</div><h2>'+t+'</h2></div>';
}

function verCliente(){
  let h = encabezado(null, true);
  h += barraPasos();
  h += '<div class="cuerpo'+(V.paso >= 6 ? ' sin-barra' : '')+'">';
  if(V.paso === 1) h += pasoServicios();
  if(V.paso === 2) h += pasoAdicionales();
  if(V.paso === 3) h += pasoDia();
  if(V.paso === 4) h += pasoHora();
  if(V.paso === 5) h += pasoDatos();
  if(V.paso === 6) h += pasoDeposito();
  if(V.paso === 7) h += pasoConfirmado();
  h += '</div>';
  if(V.paso <= 5) h += pie();
  return h;
}

function pie(){
  return '<div class="pie">NÄS Beauty Studio · '+esc(S.config.direccion)+'<br>'+
    '<a href="'+enlaceWA('Hola Ariana, vengo de la página de NÄS Beauty Studio.')+'" target="_blank" rel="noopener">WhatsApp '+esc(S.config.sinpe)+'</a>'+
    ' · <a href="https://instagram.com/nas.nails" target="_blank" rel="noopener">@nas.nails</a>'+
    '<div><button class="adm" onclick="pedirPin()">Admin</button></div></div>';
}

/* --- Paso 1: servicio principal (hasta dos) --- */
function pasoServicios(){
  let h = tituloPaso('¿Qué te vas a hacer?');
  h += '<div class="nota" style="margin:8px 0 16px">Podés elegir hasta dos servicios para la misma cita, por ejemplo manos y pies. Se reservan seguidos en un solo bloque.</div>';
  for(const s of S.servicios){
    const on = V.sel.includes(s.id);
    const tope = !on && V.sel.length >= 2;
    h += '<button class="serv '+(on?'sel':'')+'" '+(tope?'disabled':'')+' onclick="tocarServicio(\''+s.id+'\')" style="margin-bottom:9px">'+
      '<span class="marca-sel">'+ICO.check+'</span>'+
      '<span style="flex:1">'+
        '<span class="nom">'+esc(s.nombre)+'</span>'+
        '<span class="meta">'+dur(s.min)+(s.todo?' <span class="tag">estimado</span>':'')+'</span>'+
      '</span>'+
      '<span class="precio">'+col(s.precio)+'</span>'+
    '</button>';
  }
  if(V.sel.length === 2){
    h += '<div class="nota-caja" style="margin-top:6px">Dos servicios en la misma cita: el depósito es de '+col(2*S.config.depositoPorServicio)+' ('+col(S.config.depositoPorServicio)+' por servicio).</div>';
  }
  return h + barraInferior();
}

/* --- Paso 2: adicionales --- */
function pasoAdicionales(){
  let h = tituloPaso('¿Necesitás algo más?');
  h += '<div class="nota" style="margin:8px 0 16px">Si llegás con esmaltado o uñas puestas de otra cita, marcá el retiro. Suma tiempo y precio.</div>';
  for(const a of S.adicionales){
    const q = V.adic[a.id] || 0;
    const on = q > 0;
    if(a.porUnidad){
      h += '<div class="add '+(on?'sel':'')+'">'+
        '<span class="caja" onclick="ponAdic(\''+a.id+'\','+(on?0:1)+')">'+ICO.check+'</span>'+
        '<span style="flex:1"><div class="nom">'+esc(a.nombre)+'</div>'+
        '<div class="meta">'+col(a.precio)+' por uña · +'+a.min+' min c/u'+(a.todo?' <span class="tag">estimado</span>':'')+'</div></span>'+
        '<span class="cont"><button onclick="ponAdic(\''+a.id+'\','+Math.max(0,q-1)+')">−</button>'+
        '<span>'+q+'</span><button onclick="ponAdic(\''+a.id+'\','+(q+1)+')">+</button></span>'+
      '</div>';
    }else{
      h += '<button class="add '+(on?'sel':'')+'" onclick="ponAdic(\''+a.id+'\','+(on?0:1)+')">'+
        '<span class="caja">'+ICO.check+'</span>'+
        '<span style="flex:1"><div class="nom">'+esc(a.nombre)+'</div>'+
        '<div class="meta">+'+a.min+' min'+(a.todo?' <span class="tag">estimado</span>':'')+'</div></span>'+
        '<span class="precio" style="font-size:14px">'+col(a.precio)+'</span>'+
      '</button>';
    }
  }
  h += '<div class="nota" style="margin-top:14px">Podés seguir sin agregar nada.</div>';
  return h + barraInferior();
}

/* --- Paso 3: día --- */
function pasoDia(){
  const t = totalSel();
  if(!V.mes){ const p = partesCR(); const d = deYMD(p.ymd); V.mes = {y:d.getUTCFullYear(), m:d.getUTCMonth()}; }
  let h = tituloPaso('Elegí el día');
  h += '<div class="nota" style="margin:8px 0 16px">Se muestran solo los días donde caben '+dur(t.minutos)+' seguidos.</div>';
  h += '<div class="card">' + calendario() + '</div>';
  h += '<div class="nota" style="margin-top:12px;display:flex;align-items:center;gap:8px">'+
       '<i style="width:3px;height:3px;border-radius:50%;background:var(--marron-claro);display:block"></i> con espacio disponible</div>';
  return h + barraInferior();
}

function calendario(){
  const t = totalSel();
  const {y,m} = V.mes;
  const hoy = hoyCR();
  const primero = new Date(Date.UTC(y,m,1));
  const dias = new Date(Date.UTC(y,m+1,0)).getUTCDate();
  const desfase = (primero.getUTCDay()+6)%7;                     // semana inicia lunes
  const pMes = partesCR(); const dHoy = deYMD(pMes.ymd);
  const atras = (y === dHoy.getUTCFullYear() && m === dHoy.getUTCMonth());
  const maxFecha = sumarDias(hoy, S.config.diasAdelante || 60);
  const proxMes = new Date(Date.UTC(y,m+1,1)).toISOString().slice(0,10);
  const adelante = proxMes > maxFecha;
  const idx = indiceOcupado();                                   // una sola vez por repintado

  let h = '<div class="cal-enc">'+
    '<button class="flecha" '+(atras?'disabled':'')+' onclick="moverMes(-1)">'+ICO.flechaI+'</button>'+
    '<h3>'+capital(MESES[m])+' '+y+'</h3>'+
    '<button class="flecha" '+(adelante?'disabled':'')+' onclick="moverMes(1)">'+ICO.flechaD+'</button>'+
  '</div><div class="cal">';
  for(const d of ['L','M','M','J','V','S','D']) h += '<div class="dow">'+d+'</div>';
  for(let i=0;i<desfase;i++) h += '<div></div>';
  for(let d=1;d<=dias;d++){
    const f = y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const fuera = f < hoy || f > maxFecha;
    const libre = !fuera && espacios(f, t.minutos, {indice:idx}).length > 0;
    h += '<button class="dia '+(V.fecha===f?'sel':'')+' '+(f===hoy?'hoy':'')+'" '+(libre?'':'disabled')+
         ' onclick="elegirDia(\''+f+'\')">'+d+(libre?'<i></i>':'')+'</button>';
  }
  return h+'</div>';
}

/* --- Paso 4: hora --- */
function pasoHora(){
  const t = totalSel();
  const libres = espacios(V.fecha, t.minutos);
  let h = tituloPaso('Elegí la hora');
  h += '<div class="nota" style="margin:8px 0 16px">'+capital(fechaLarga(V.fecha))+' · '+dur(t.minutos)+' de atención.</div>';
  if(!libres.length){
    h += vacio('Ese día se llenó mientras elegías. Probá con otro.', 'hoja');
    h += '<button class="btn sec" onclick="irPaso(3)">Ver otros días</button>';
    return h + barraInferior();
  }
  const manana = libres.filter(x=>x<12*60), tarde = libres.filter(x=>x>=12*60);
  if(manana.length){
    h += '<div class="rot">Mañana</div><div class="horas">';
    for(const x of manana) h += '<button class="hora '+(V.hora===x?'sel':'')+'" onclick="elegirHora('+x+')">'+hora12(x)+'</button>';
    h += '</div>';
  }
  if(tarde.length){
    h += '<div class="rot">Tarde</div><div class="horas">';
    for(const x of tarde) h += '<button class="hora '+(V.hora===x?'sel':'')+'" onclick="elegirHora('+x+')">'+hora12(x)+'</button>';
    h += '</div>';
  }
  if(V.hora!=null) h += '<div class="nota" style="margin-top:14px">Terminarías cerca de las '+hora12(V.hora+t.minutos)+'.</div>';
  return h + barraInferior();
}

    '<div class="monto">'+col(c.deposito)+'</div>'+
    '<div class="det">'+c.servicios.length+' servicio'+(c.servicios.length>1?'s':'')+' × '+col(S.config.depositoPorServicio)+
      ' · se descuenta del total el día de la cita</div>'+
    '<div class="sinpe"><div><div class="k">SINPE Móvil</div><div class="n">'+esc(S.config.sinpe)+'</div></div>'+
      '<button class="copiar" onclick="copiar(\''+esc(S.config.sinpe).replace(/[^0-9-]/g,'')+'\')">'+ICO.copiar+'Copiar</button></div>'+
    '<div class="nota" style="margin-top:10px;text-align:left">A nombre de '+esc(S.config.titular)+'. En el detalle del SINPE escribí tu nombre completo. El depósito no es reembolsable.</div>'+

    '</label>'+

/* Resumen de una cita, en líneas */
function resumenCita(c, conFecha){
  let h = '';
  if(conFecha){
    h += '<div style="display:flex;align-items:baseline;gap:10px;margin-bottom:12px">'+
      '<div class="grande" style="flex:1">'+capital(fechaLarga(c.fecha))+'</div>'+
      '<div class="grande">'+hora12(aMin(c.hora))+'</div></div><div class="sep" style="margin:0 0 10px"></div>';
  }
  for(const s of c.servicios) h += '<div class="lin"><span>'+esc(s.nombre)+'</span><span class="v">'+col(s.precio)+'</span></div>';
  for(const a of (c.adicionales||[])) h += '<div class="lin sub"><span>'+esc(a.nombre)+(a.cant>1?' × '+a.cant:'')+'</span><span class="v">'+col(a.precio*a.cant)+'</span></div>';
  h += '<div class="lin sub" style="margin-top:6px"><span>Duración</span><span class="v">'+dur(c.duracion)+'</span></div>';
  h += '<div class="lin tot"><span>Total</span><span class="v">'+col(c.total)+'</span></div>';
  h += '<div class="lin sub"><span>Depósito para apartar</span><span class="v">'+col(c.deposito)+'</span></div>';
  h += '<div class="lin sub"><span>Se paga en el estudio</span><span class="v">'+col(c.total - c.deposito)+'</span></div>';
  return h;
}

function barraInferior(){
  const t = totalSel();
  let listo = false, txt = 'Continuar';
  if(V.paso === 1){ listo = V.sel.length > 0; txt = V.sel.length ? 'Continuar' : 'Elegí un servicio'; }
  if(V.paso === 2) listo = true;
  if(V.paso === 3){ listo = !!V.fecha; txt = V.fecha ? 'Continuar' : 'Elegí un día'; }
  if(V.paso === 4){ listo = V.hora != null; txt = V.hora != null ? 'Continuar' : 'Elegí una hora'; }
  if(V.paso === 5){ listo = true; txt = 'Apartar mi espacio'; }
  let h = '<div class="barra"><div class="in">';
  if(V.sel.length){
    h += '<div class="resumen-min"><b>'+col(t.precio)+'</b><span>'+dur(t.minutos)+'</span>';
    if(V.fecha && V.paso>=4) h += '<span><span class="punto"></span> '+fechaCorta(V.fecha)+(V.hora!=null?' · '+hora12(V.hora):'')+'</span>';
    if(V.paso>1) h += '<button class="txt-btn atras" onclick="irPaso('+(V.paso-1)+')">Atrás</button>';
    h += '</div>';
  }
  h += '<button class="btn" '+(listo?'':'disabled')+' onclick="siguiente()">'+txt+'</button>';
  return h+'</div></div>';
}

function vacio(txt, ico){
  return '<div class="vacio"><div class="ic">'+(ICO[ico]||ICO.hoja)+'</div>'+txt+'</div>';
}

/* ============================================================
   7. Acciones del flujo
   ============================================================ */
function tocarServicio(id){
  const i = V.sel.indexOf(id);
  if(i >= 0) V.sel.splice(i,1);
  else if(V.sel.length < 2) V.sel.push(id);
  V.hora = null;
  pintar();
}
function ponAdic(id,q){
  q = Math.max(0, Math.min(10, q));
  if(q === 0) delete V.adic[id]; else V.adic[id] = q;
  V.hora = null;
  pintar();
}
function elegirDia(f){ V.fecha = f; V.hora = null; pintar(); }
function elegirHora(x){ V.hora = x; pintar(); }
function moverMes(n){
  let {y,m} = V.mes; m += n;
  if(m < 0){ m = 11; y--; } if(m > 11){ m = 0; y++; }
  V.mes = {y,m}; pintar();
}
function irPaso(p){
  if(p <= 5 && V.citaId) soltarApartado(true);
  V.paso = p; V.errores = {};
  window.scrollTo(0,0);
  pintar();
}
function siguiente(){
  if(V.paso === 1 && !V.sel.length) return;
  if(V.paso === 3 && !V.fecha) return;
  if(V.paso === 4 && V.hora == null) return;
  if(V.paso === 5){ if(!validarDatos()) { pintar(); return; } crearApartado(); return; }
  irPaso(V.paso + 1);
}
function validarDatos(){
  const c = V.cliente, e = {};
  if(c.nombre.trim().split(/\s+/).filter(Boolean).length < 2) e.nombre = 'Escribí tu nombre y apellido.';
  const dig = c.tel.replace(/\D/g,''), p = pais(c.pais);
  if(dig.length !== p.len) e.tel = 'El teléfono de '+p.n+' lleva '+p.len+' dígitos.';
  if(!/^[^\s@]+@[^\s@]+\.[a-z]{2,}$/i.test(c.email.trim())) e.email = 'Revisá el correo.';
  V.errores = e;
  return Object.keys(e).length === 0;
}

function nuevoId(){ return 'c'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }

/* Congela precios y duraciones dentro de la cita: el histórico no cambia
   si mañana ella sube la lista de precios. */
const soloDigitos = s => String(s||'').replace(/\D/g,'');

/* Apartados sin confirmar que ya tiene esta persona, por teléfono o correo */
function apartadosDe(tel, email){
  const t = soloDigitos(tel), e = (email||'').trim().toLowerCase();
  return S.citas.filter(c =>
    (c.estado === 'pendiente' || (c.estado === 'apartada' && bloquea(c))) &&
    ((t && soloDigitos(c.cliente.tel).endsWith(t.slice(-8))) ||
     (e && (c.cliente.email||'').trim().toLowerCase() === e))
  );
}

function crearApartado(){
  const t = totalSel();
  if(!espacios(V.fecha, t.minutos).includes(V.hora)){
    aviso('Ese espacio ya no está disponible');
    V.hora = null; irPaso(4); return;
  }
  const previos = apartadosDe(V.cliente.tel, V.cliente.email);
  if(previos.length >= (S.config.maxApartados || 2)){
    V.errores = {limite:
      'Ya tenés '+previos.length+' espacio'+(previos.length>1?'s':'')+' sin confirmar ('+
      previos.map(c=>fechaCorta(c.fecha)+' a las '+hora12(aMin(c.hora))).join(' y ')+
      '). Completá el depósito de '+(previos.length>1?'esos':'ese')+' antes de apartar otro.'};
    V.paso = 5; window.scrollTo(0,0); pintar(); return;
  }
  const p = pais(V.cliente.pais);
  const c = {
    id:nuevoId(),
    fecha:V.fecha,
    hora:aHora(V.hora),
    duracion:t.minutos,
    servicios:V.sel.map(id=>{ const s=servicio(id); return {id:s.id, nombre:s.nombre, precio:s.precio, min:s.min}; }),
    adicionales:Object.keys(V.adic).map(id=>{ const a=adicional(id); return {id:a.id, nombre:a.nombre, precio:a.precio, min:a.min, cant:V.adic[id]}; }),
    total:t.precio,
    deposito:t.deposito,
    cliente:{ nombre:V.cliente.nombre.trim(), tel:p.d+' '+V.cliente.tel.replace(/\D/g,''), email:V.cliente.email.trim() },
    estado:'apartada',
    origen:'link',
    creada:Date.now(),
    apartadoHasta: finApartado(V.fecha, V.hora),
    comprobante:null,
    captura:null
  };
  S.citas.push(c);
  V.citaId = c.id;
  V.comprobante = ''; V.captura = null; V.errores = {};
  guardar();
  V.paso = 6; window.scrollTo(0,0); pintar();
}

function soltarApartado(silencio){
  const i = S.citas.findIndex(c=>c.id===V.citaId);
  if(i >= 0 && (S.citas[i].estado === 'apartada' || S.citas[i].estado === 'expirada')) S.citas.splice(i,1);
  V.citaId = null; guardar();
  if(!silencio){ aviso('Espacio liberado'); irPaso(4); }
}

function tomarCaptura(inp){
  const f = inp.files && inp.files[0];
  if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    const img = new Image();
    img.onload = () => {
      const max = 900, e = Math.min(1, max/Math.max(img.width,img.height));
      const cv = document.createElement('canvas');
      cv.width = Math.round(img.width*e); cv.height = Math.round(img.height*e);
      cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
      V.captura = cv.toDataURL('image/jpeg',.7);
      pintar();
    };
    img.onerror = () => aviso('No se pudo leer la imagen');
    img.src = r.result;
  };
  r.readAsDataURL(f);
}

function enviarComprobante(){
  const c = S.citas.find(x=>x.id===V.citaId);
  if(!c) return;
  if(c.estado === 'expirada'){ pintar(); return; }
  if(!V.comprobante.trim() && !V.captura){
    V.errores = {comp:'Escribí el número del comprobante o adjuntá la captura.'};
    pintar(); return;
  }
  c.comprobante = V.comprobante.trim() || null;
  c.captura = V.captura;
  c.estado = 'pendiente';
  c.enviado = Date.now();
  V.errores = {};
  guardar();
  V.paso = 7; window.scrollTo(0,0); pintar();
}

function reiniciarFlujo(){
  V.sel = []; V.adic = {}; V.fecha = null; V.hora = null; V.citaId = null;
  V.cliente = {nombre:'',pais:'CR',tel:'',email:''};
  V.comprobante = ''; V.captura = null; V.errores = {}; V.paso = 1;
  V.pantalla = 'inicio';
  window.scrollTo(0,0); pintar();
}

function copiar(txt){
  const ok = () => aviso('Número copiado');
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(ok, () => copiaVieja(txt, ok));
  } else copiaVieja(txt, ok);
}
function copiaVieja(txt, ok){
  const a = document.createElement('textarea');
  a.value = txt; a.style.position='fixed'; a.style.opacity='0';
  document.body.appendChild(a); a.select();
  try{ document.execCommand('copy'); ok(); }catch(e){ aviso(txt); }
  document.body.removeChild(a);
}

function abrirWhatsApp(id){
  const c = S.citas.find(x=>x.id===id); if(!c) return;
  const l = [];
  l.push('Hola '+S.config.titular+', aparté una cita por la agenda en línea.');
  l.push('');
  l.push('Nombre: '+c.cliente.nombre);
  l.push('Día: '+fechaLarga(c.fecha));
  l.push('Hora: '+hora12(aMin(c.hora)));
  l.push('Servicios: '+c.servicios.map(s=>s.nombre).join(' + '));
  if(c.adicionales && c.adicionales.length) l.push('Adicionales: '+c.adicionales.map(a=>a.nombre+(a.cant>1?' x'+a.cant:'')).join(', '));
  l.push('Duración: '+dur(c.duracion));
  l.push('Total: '+col(c.total));
  l.push('Depósito enviado: '+col(c.deposito));
  if(c.comprobante) l.push('Comprobante: '+c.comprobante);
  l.push('');
  l.push('Adjunto la captura del SINPE.');
  window.open('https://wa.me/'+S.config.whatsapp+'?text='+encodeURIComponent(l.join('\n')), '_blank');
}

    '<input class="inp" id="pin" inputmode="numeric" maxlength="6" type="password" style="text-align:center;letter-spacing:.5em;font-size:22px" '+
    'onkeydown="if(event.key===\'Enter\')validarPin()">'+
    '<div id="pin-err" class="err" style="text-align:center"></div>'+
    '<div style="height:12px"></div><button class="btn" onclick="validarPin()">Entrar</button>');
  setTimeout(()=>{ const e=document.getElementById('pin'); if(e) e.focus(); },80);
}
function validarPin(){
  const v = (document.getElementById('pin')||{}).value || '';
  if(v === S.config.pin){
    cerrarModal();
    V.admin.pinOk = true;
    V.admin.fecha = hoyCR();
    V.pantalla = 'admin';
    window.scrollTo(0,0); pintar();

function cuenta(hasta){
  let s = Math.max(0, Math.floor((hasta - Date.now())/1000));
  const h = Math.floor(s/3600); s -= h*3600;
  const m = Math.floor(s/60); s -= m*60;
  return (h>0? h+':' : '') + String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
}

function encCita(c, extra){
  return '<div class="cita-enc"><div class="h">'+hora12(aMin(c.hora)).replace(' ','<span style="font-size:11px;letter-spacing:.06em"> ')+'</span></div>'+
    '<div style="flex:1;min-width:0"><div class="nm">'+esc(c.cliente.nombre)+'</div>'+
    '<div class="sub">'+fechaCorta(c.fecha)+' · '+dur(c.duracion)+' · '+(c.origen==='manual'?'registrada a mano':'por el link')+'</div></div>'+
    '<div class="lado"><span class="est '+c.estado+'">'+etiqueta(c.estado)+'</span>'+(extra||'')+'</div></div>';
}
/* Arma el enlace de WhatsApp hacia la clienta.
   Los teléfonos están guardados como "+506 8812 4497": hay que dejar
   solo los dígitos. Devuelve null si la cita no tiene teléfono. */
function waCliente(c){
  let n = soloDigitos(c.cliente && c.cliente.tel);
  if(!n) return null;
  if(n.length === 8) n = '506' + n;                 // número tico sin código de país
  const resta = c.total - (['pendiente','aprobada','completada'].includes(c.estado) ? c.deposito : 0);
  const datos = {
    nombre:(c.cliente.nombre||'').split(' ')[0] || c.cliente.nombre,
    dia:fechaLarga(c.fecha),
    hora:hora12(aMin(c.hora)),
    servicios:c.servicios.map(s=>s.nombre).join(' + ').toLowerCase(),
    duracion:dur(c.duracion),
    total:col(c.total),
    deposito:col(c.deposito),
    resta:col(resta),
    sinpe:S.config.sinpe
  };
  const plantilla = MENSAJES_WA[c.estado] || MENSAJES_WA.otro;
  const texto = plantilla
    .replace(/\{(\w+)\}/g, (m,k) => datos[k] !== undefined ? datos[k] : m)
    .replace(/\.\.(?!\.)/g, '.');        // "a las 11:30 a.m.." -> "a las 11:30 a.m."
  return 'https://wa.me/'+n+'?text='+encodeURIComponent(texto);
}
function botonWA(c){
  const url = waCliente(c);
  if(!url) return '';                               // sin teléfono, sin botón
  return '<a class="mini w" href="'+url+'" target="_blank" rel="noopener">'+ICO.wa+'WhatsApp</a>';
}

function etiqueta(e){
  return {apartada:'Apartada', pendiente:'Por confirmar', aprobada:'Confirmada', completada:'Completada',
          rechazada:'Rechazada', cancelada:'Cancelada', expirada:'Expirada'}[e] || e;
}
function detalleCita(c){
  let h = '<div class="cuerpo-cita">';
  for(const s of c.servicios) h += '<div class="lin"><span>'+esc(s.nombre)+'</span><span class="v">'+col(s.precio)+'</span></div>';
  for(const a of (c.adicionales||[])) h += '<div class="lin sub"><span>'+esc(a.nombre)+(a.cant>1?' × '+a.cant:'')+'</span><span class="v">'+col(a.precio*a.cant)+'</span></div>';
  h += '<div class="lin tot"><span>Total</span><span class="v">'+col(c.total)+'</span></div>';
  const dep = ['pendiente','aprobada','completada'].includes(c.estado) ? c.deposito : 0;
  const etDep = dep ? 'Depósito recibido'
              : (c.estado === 'apartada' ? 'Depósito por llegar'
              : (c.origen === 'manual' ? 'Sin depósito, cita a mano' : 'Sin depósito'));
  h += '<div class="lin sub"><span>'+etDep+'</span><span class="v">'+col(dep)+'</span></div>';
  h += '<div class="lin sub"><span>Por cobrar en el estudio</span><span class="v">'+col(c.total-dep)+'</span></div>';
  h += '<div class="sep"></div><div class="nota">'+esc(c.cliente.tel||'sin teléfono')+
       (c.cliente.email?' · '+esc(c.cliente.email):'')+'</div>';
  return h+'</div>';
}

/* --- Mover cita --- */
function modalMover(id){
  const c = S.citas.find(x=>x.id===id); if(!c) return;
  V._mover = { id:id, fecha:c.fecha, hora:null };
  pintarMover();
}
function pintarMover(){
  const m = V._mover, c = S.citas.find(x=>x.id===m.id);
  let libres = espacios(m.fecha, c.duracion, {excluir:c.id, admin:true});
  // una cita apartada necesita que el apartado siga durando algo después de moverla
  if(c.estado === 'apartada')
    libres = libres.filter(x => minutosHasta(m.fecha, x) - COLCHON_CITA >= APARTADO_MIN);

  let h = '<div class="modal-enc"><div><h3>Mover cita</h3>'+
    '<div class="nota">'+esc(c.cliente.nombre)+' · '+dur(c.duracion)+' · queda como <b style="font-weight:400">'+etiqueta(c.estado).toLowerCase()+'</b></div></div>'+
    '<button class="x" onclick="cerrarModal()">×</button></div>';
  h += '<div class="campo"><label>Día</label><input class="inp" type="date" value="'+m.fecha+'" min="'+hoyCR()+'" onchange="V._mover.fecha=this.value;V._mover.hora=null;pintarMover()"></div>';
  h += '<div class="campo"><label>Hora disponible</label>';
  if(!libres.length) h += '<div class="nota-caja">Ese día no tiene un espacio de '+dur(c.duracion)+' libre'+
    (c.estado==='apartada'?' con margen suficiente para el apartado.':'.')+'</div>';
  else{
    h += '<div class="horas">';
    for(const x of libres) h += '<button class="hora '+(m.hora===x?'sel':'')+'" onclick="V._mover.hora='+x+';pintarMover()">'+hora12(x)+'</button>';
    h += '</div>';
  }
  h += '</div>';
  if(c.estado === 'apartada' && m.hora != null){
    h += '<div class="nota-caja">Al mover, el apartado pasa a vencer en <b style="font-weight:400;color:var(--alerta)">'+
      cuenta(finApartado(m.fecha, m.hora))+'</b>.</div>';
  }
  if(m.err) h += '<div class="err">'+m.err+'</div>';
  h += '<div style="height:10px"></div>';
  h += '<button class="btn" '+(m.hora==null?'disabled':'')+' onclick="confirmarMover()">Mover</button>';
  modal(h);
}
function confirmarMover(){
  const m = V._mover, c = S.citas.find(x=>x.id===m.id);
  if(!c || m.hora==null) return;
  // se revalida justo antes de guardar, por si algo cambió mientras el modal estaba abierto
  if(chocaCon(m.fecha, m.hora, c.duracion, c.id)){
    m.err = 'Ese espacio se acaba de ocupar. Elegí otra hora.';
    m.hora = null; pintarMover(); return;
  }
  c.fecha = m.fecha; c.hora = aHora(m.hora);
  // la cita conserva su estado; si estaba apartada, el reloj se recalcula
  if(c.estado === 'apartada') c.apartadoHasta = finApartado(c.fecha, m.hora);
  guardar(); cerrarModal(); V.admin.fecha = c.fecha; aviso('Cita movida'); pintar();
}

/* --- Cita manual (para las de siempre, que escriben directo) --- */
function modalManual(){
  const p = partesCR();
  V._man = { serv:[S.servicios[0].id], fecha:p.ymd, hora:null, nombre:'', tel:'', err:'' };
  pintarManual();
}
function pintarManual(){
  const m = V._man;
  let minutos = 0, precio = 0;
  for(const id of m.serv){ const s=servicio(id); if(s){ minutos += s.min; precio += s.precio; } }
  const p = partesCR();
  const esHoy = m.fecha === p.ymd;
  const libres = espacios(m.fecha, minutos, {incluirPasadas:true});
  const ahoraMin = Math.floor(p.min/5)*5;
  const ahoraLibre = esHoy && !chocaCon(m.fecha, ahoraMin, minutos);

  let h = '<div class="modal-enc"><div><h3>Cita manual</h3>'+
    '<div class="nota">Queda confirmada de una, sin pedir depósito.</div></div>'+
    '<button class="x" onclick="cerrarModal()">×</button></div>';

  h += '<div class="campo"><label>Servicio</label><div class="chips">';
  for(const s of S.servicios){
    const on = m.serv.includes(s.id);
    h += '<button class="chip '+(on?'on':'')+'" onclick="manServ(\''+s.id+'\')">'+esc(s.nombre.replace('semipermanente','semiperm.'))+'</button>';
  }
  h += '</div><div class="nota" style="margin-top:7px">'+col(precio)+' · '+dur(minutos)+' · depósito no requerido</div></div>';

  h += '<div class="campo"><label>Nombre</label><input class="inp" id="man-nombre" value="'+esc(m.nombre)+'" oninput="V._man.nombre=this.value" autocomplete="name"></div>';
  h += '<div class="dos"><div class="campo" style="flex:1"><label>Día</label>'+
    '<input class="inp" type="date" value="'+m.fecha+'" onchange="V._man.fecha=this.value;V._man.hora=null;pintarManual()"></div>'+
    '<div class="campo" style="flex:1"><label>Teléfono <span style="text-transform:none;letter-spacing:0">(opcional)</span></label>'+
    '<input class="inp" inputmode="tel" value="'+esc(m.tel)+'" oninput="V._man.tel=this.value"></div></div>';

  h += '<div class="campo"><label>Hora</label>';
  h += '<div class="horas">';
  if(ahoraLibre) h += '<button class="hora '+(m.hora==='ya'?'sel':'')+'" style="grid-column:span 3" onclick="V._man.hora=\'ya\';pintarManual()">Ahora mismo · '+hora12(ahoraMin)+'</button>';
  for(const x of libres) h += '<button class="hora '+(m.hora===x?'sel':'')+'" onclick="V._man.hora='+x+';pintarManual()">'+hora12(x)+'</button>';
  h += '</div>';
  if(!libres.length && !ahoraLibre) h += '<div class="nota-caja" style="margin-top:8px">No hay un espacio de '+dur(minutos)+' libre ese día. Podés mover otra cita o cambiar el horario del día en Configuración.</div>';
  h += '</div>';
  if(m.err) h += '<div class="err">'+m.err+'</div>';
  h += '<div style="height:10px"></div><button class="btn" '+(m.hora==null?'disabled':'')+' onclick="guardarManual()">Guardar cita</button>';
  modal(h);
}
function manServ(id){
  const m = V._man, i = m.serv.indexOf(id);
  if(i>=0){ if(m.serv.length>1) m.serv.splice(i,1); }
  else if(m.serv.length<2) m.serv.push(id);
  m.hora = null; pintarManual();
}
function guardarManual(){
  const m = V._man;
  if(!m.nombre.trim()){ m.err='Escribí el nombre de la clienta.'; pintarManual(); return; }
  const p = partesCR();
  const inicio = m.hora==='ya' ? Math.floor(p.min/5)*5 : m.hora;
  let minutos = 0, precio = 0;
  const servs = m.serv.map(id=>{ const s=servicio(id); minutos+=s.min; precio+=s.precio; return {id:s.id,nombre:s.nombre,precio:s.precio,min:s.min}; });
  if(chocaCon(m.fecha, inicio, minutos)){ m.err='Ese espacio choca con otra cita.'; pintarManual(); return; }
  S.citas.push({
    id:nuevoId(), fecha:m.fecha, hora:aHora(inicio), duracion:minutos,
    servicios:servs, adicionales:[], total:precio, deposito:0,
    cliente:{nombre:m.nombre.trim(), tel:m.tel.trim(), email:''},
    estado:'aprobada', origen:'manual', creada:Date.now(), apartadoHasta:0, comprobante:null, captura:null
  });
  guardar(); cerrarModal();
  V.admin.tab='agenda'; V.admin.fecha=m.fecha;
  aviso('Cita guardada'); pintar();
}

      '<td class="w-precio"><input class="inp" type="number" step="500" value="'+a.precio+'" onchange="setAdic('+i+',\'precio\',this.value)"></td>'+
      '<td class="w-min"><input class="inp" type="number" step="5" value="'+a.min+'" onchange="setAdic('+i+',\'min\',this.value)"></td></tr>';
  });
  h += '</table></div>';

  h += '<div class="rot">Depósito y apartado</div>';
  h += '<div class="card">'+
    '<div class="campo"><label>Depósito por servicio</label>'+
    '<input class="inp" type="number" step="500" value="'+S.config.depositoPorServicio+'" onchange="setCfg(\'depositoPorServicio\',this.value)"></div>'+
    '<div class="campo"><label>Horas que dura el apartado</label>'+
    '<input class="inp" type="number" step="1" min="1" value="'+S.config.horasApartado+'" onchange="setCfg(\'horasApartado\',this.value)"></div>'+
    '<div class="campo"><label>Máximo de apartados sin confirmar por persona</label>'+
    '<input class="inp" type="number" step="1" min="1" value="'+S.config.maxApartados+'" onchange="setCfg(\'maxApartados\',this.value)"></div>'+
    '<div class="campo"><label>Número de SINPE Móvil</label>'+
    '<input class="inp" value="'+esc(S.config.sinpe)+'" onchange="setCfg(\'sinpe\',this.value)"></div>'+
    '<div class="nota">Dos servicios en una cita piden el doble: '+col(2*S.config.depositoPorServicio)+'. '+
    'El apartado siempre vence '+COLCHON_CITA+' minutos antes de la cita, aunque le sobre tiempo.</div>'+
  '</div>';

  h += '<div class="rot">Cuándo se puede reservar</div>';
  h += '<div class="card">'+
    '<div class="campo"><label>Anticipación mínima, en minutos</label>'+
    '<input class="inp" type="number" step="30" min="0" value="'+S.config.anticipacionMinima+'" onchange="setCfg(\'anticipacionMinima\',this.value)">'+
    '<div class="nota" style="margin-top:6px">Son '+dur(S.config.anticipacionMinima)+'. Nadie puede reservar por el link para dentro de menos de ese rato, '+
    'para que te dé tiempo de ver el SINPE y confirmar. Las citas que anotás a mano no tienen este límite.</div></div>'+
    '<div class="campo" style="margin-bottom:0"><label>Días hacia adelante que se pueden reservar</label>'+
    '<input class="inp" type="number" step="15" min="1" value="'+S.config.diasAdelante+'" onchange="setCfg(\'diasAdelante\',this.value)">'+
    '<div class="nota" style="margin-top:6px">El calendario llega hasta el '+fechaCorta(sumarDias(hoyCR(), S.config.diasAdelante))+'.</div></div>'+
  '</div>';

  h += '<div class="rot">Datos de la demo</div>';
  h += '<div class="card"><div class="nota" style="margin-bottom:10px">Deja las citas de ejemplo como estaban al abrir por primera vez.</div>'+
    '<button class="mini r" onclick="if(confirm(\'¿Restablecer las citas de ejemplo?\')){reiniciar();V.admin.fecha=hoyCR();pintar();aviso(\'Demo restablecida\')}">Restablecer la demo</button></div>';
  return h;
}
function setHora(d,k,q,v){ if(!v) return; S.horarios[d][k][q]=v; guardar(); aviso('Horario guardado'); pintar(); }
function quitarBloque(d,k){ S.horarios[d].splice(k,1); guardar(); pintar(); }
function agregarBloque(d){
  const bl = S.horarios[d];
  bl.push(bl.length ? {ini:'14:00',fin:'18:00'} : {ini:'09:00',fin:'18:00'});
  guardar(); pintar();
}
function agregarBloqueo(){
  const v = (document.getElementById('f-bloq')||{}).value;
  if(!v) return;
  if(!S.fechasBloqueadas.includes(v)) S.fechasBloqueadas.push(v);
  guardar(); aviso('Día cerrado'); pintar();
}
function quitarBloqueo(f){ S.fechasBloqueadas = S.fechasBloqueadas.filter(x=>x!==f); guardar(); pintar(); }
function setServ(i,q,v){ S.servicios[i][q] = (q==='nombre'? v : Math.max(0,parseInt(v,10)||0)); if(q!=='nombre') S.servicios[i].todo=false; guardar(); aviso('Servicio actualizado'); pintar(); }
function setAdic(i,q,v){ S.adicionales[i][q] = (q==='nombre'? v : Math.max(0,parseInt(v,10)||0)); if(q!=='nombre') S.adicionales[i].todo=false; guardar(); aviso('Adicional actualizado'); pintar(); }
function setCfg(q,v){
  const minimos = {horasApartado:1, maxApartados:1, diasAdelante:1};
  S.config[q] = (q==='sinpe') ? v : Math.max(minimos[q] || 0, parseInt(v,10)||0);
  guardar(); aviso('Guardado'); pintar();
}

/* --- Ingresos: solo citas completadas --- */
function tabIngresos(){
  const hoy = hoyCR(), sem = inicioSemana(hoy), mes = hoy.slice(0,7);
  const hechas = S.citas.filter(c=>c.estado==='completada');
  const sum = arr => arr.reduce((s,c)=>s+c.total,0);
  const delDia = hechas.filter(c=>c.fecha===hoy);
  const delSem = hechas.filter(c=>c.fecha>=sem && c.fecha<=sumarDias(sem,6));
  const delMes = hechas.filter(c=>c.fecha.slice(0,7)===mes);

  let h = '<div class="rot">Cobrado, solo citas completadas</div>';
  h += '<div class="kpis">'+
    '<div class="kpi"><div class="k">Hoy</div><div class="v">'+col(sum(delDia))+'</div><div class="s">'+delDia.length+' cita'+(delDia.length===1?'':'s')+'</div></div>'+
    '<div class="kpi"><div class="k">Semana</div><div class="v">'+col(sum(delSem))+'</div><div class="s">'+delSem.length+' cita'+(delSem.length===1?'':'s')+'</div></div>'+
    '<div class="kpi"><div class="k">Mes</div><div class="v">'+col(sum(delMes))+'</div><div class="s">'+delMes.length+' cita'+(delMes.length===1?'':'s')+'</div></div>'+
  '</div>';

  const porLink = S.citas.filter(c=>c.origen==='link' && c.fecha.slice(0,7)===mes && ['aprobada','completada'].includes(c.estado));
  h += '<div style="height:14px"></div>';
  h += '<div class="destacado"><div class="et" style="font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--marron-claro)">Citas que entraron solas</div>'+
    '<div class="v">'+porLink.length+'</div>'+
    '<div class="nota">agendadas por el link este mes, sin que tocaras el teléfono. '+
    (porLink.length ? 'Son '+col(porLink.reduce((s,c)=>s+c.total,0))+' coordinados sin escribir un mensaje.' : 'Cuando alguien reserve por el link, se cuenta acá.')+'</div></div>';

  h += '<div class="rot">Desglose del mes por servicio</div>';
  const cuentas = {};
  for(const c of delMes){
    for(const s of c.servicios){
      cuentas[s.nombre] = cuentas[s.nombre] || {n:0,m:0};
      cuentas[s.nombre].n++; cuentas[s.nombre].m += s.precio;
    }
  }
  let extras = 0;
  for(const c of delMes) for(const a of (c.adicionales||[])) extras += a.precio*a.cant;
  const filas = Object.entries(cuentas).sort((a,b)=>b[1].m-a[1].m);
  if(!filas.length && !extras) h += vacio('Todavía no hay citas completadas este mes.','hoja');
  else{
    h += '<div class="card">';
    for(const [n,d] of filas) h += '<div class="lin"><span>'+esc(n)+' <span class="nota">× '+d.n+'</span></span><span class="v">'+col(d.m)+'</span></div>';
    if(extras) h += '<div class="lin sub"><span>Adicionales y retiros</span><span class="v">'+col(extras)+'</span></div>';
    h += '<div class="lin tot"><span>Total del mes</span><span class="v">'+col(sum(delMes))+'</span></div></div>';
  }

  const dep = delMes.reduce((s,c)=>s+c.deposito,0);
  h += '<div class="rot">Cómo entró la plata este mes</div>';
  h += '<div class="card">'+
    '<div class="lin"><span>Adelantado por SINPE (depósitos)</span><span class="v">'+col(dep)+'</span></div>'+
    '<div class="lin"><span>Cobrado en el estudio</span><span class="v">'+col(sum(delMes)-dep)+'</span></div>'+
    '<div class="lin tot"><span>Total</span><span class="v">'+col(sum(delMes))+'</span></div>'+
    '<div class="nota" style="margin-top:10px">Los depósitos ya estaban en tu cuenta antes de que la clienta llegara.</div>'+
  '</div>';
  return h;
}

/* ============================================================
   9. Datos de ejemplo para la demostración
   ============================================================ */
function capturaDemo(){
  // Imagen neutra que representa la captura adjunta en la demo.
  const c = document.createElement('canvas');
  c.width = 420; c.height = 260;
  const x = c.getContext('2d');
  x.fillStyle = '#EFE9E1'; x.fillRect(0,0,420,260);
  x.strokeStyle = 'rgba(140,114,89,.35)'; x.lineWidth = 1;
  x.strokeRect(20.5,20.5,379,219);
  x.fillStyle = '#8C7259';
  x.font = '300 15px Jost, sans-serif';
  x.fillText('Captura del comprobante', 44, 70);
  x.font = '300 12px Jost, sans-serif';
  x.fillStyle = '#6E645A';
  x.fillText('La clienta adjunta acá su pantallazo del SINPE.', 44, 100);
  x.fillText('Ejemplo de la demo.', 44, 122);
  x.beginPath();
  for(let i=0;i<3;i++){ x.moveTo(44,155+i*22); x.lineTo(300-i*60,155+i*22); }
  x.strokeStyle = 'rgba(181,172,156,.7)'; x.lineWidth = 6; x.stroke();
  return c.toDataURL('image/jpeg',.72);
}

function sembrar(){
  const hoy = hoyCR();
  // próximos días con horario abierto
  const abiertos = [];
  for(let i=0;i<14 && abiertos.length<4;i++){
    const f = sumarDias(hoy,i);
    if((S.horarios[diaSemana(f)]||[]).length) abiertos.push(f);
  }
  const d0 = abiertos[0]||hoy, d1 = abiertos[1]||sumarDias(hoy,1), d2 = abiertos[2]||sumarDias(hoy,2);
  // día abierto anterior, para los ingresos del mes
  let dPrev = hoy;
  for(let i=1;i<=10;i++){ const f=sumarDias(hoy,-i); if((S.horarios[diaSemana(f)]||[]).length){ dPrev=f; break; } }

  const arma = (nombre, tel, fecha, ids, adics, estado, extra) => {
    let minutos=0, precio=0;
    const servs = ids.map(id=>{ const s=servicio(id); minutos+=s.min; precio+=s.precio; return {id:s.id,nombre:s.nombre,precio:s.precio,min:s.min}; });
    const ads = (adics||[]).map(([id,q])=>{ const a=adicional(id); minutos+=a.min*q; precio+=a.precio*q; return {id:a.id,nombre:a.nombre,precio:a.precio,min:a.min,cant:q}; });
    const pref = (extra&&extra.pref) || 9*60;
    let libres = espacios(fecha, minutos, {incluirPasadas:true});
    // una cita completada tiene que haber terminado ya
    if(estado === 'completada' && fecha === hoyCR()){
      libres = libres.filter(x => x + minutos <= minCR());
    }
    if(!libres.length) return null;
    let mejor = libres[0];
    for(const x of libres) if(Math.abs(x-pref) < Math.abs(mejor-pref)) mejor = x;
    const c = {
      id:nuevoId(), fecha, hora:aHora(mejor), duracion:minutos, servicios:servs, adicionales:ads,
      total:precio, deposito: estado==='manual' ? 0 : ids.length*S.config.depositoPorServicio,
      cliente:{nombre, tel, email: nombre.toLowerCase().split(' ')[0]+'@correo.com'},
      estado, origen:(extra&&extra.origen)||'link', creada:Date.now()-3600e3,
      // el apartado de ejemplo tampoco puede vencer después de su propia cita
      apartadoHasta: (extra&&extra.apartadoHasta) ? Math.min(extra.apartadoHasta, finApartado(fecha, mejor)) : 0,
      comprobante:(extra&&extra.comprobante)||null,
      captura:(extra&&extra.captura)||null
    };
    if(estado==='completada') c.completada = Date.now();
    S.citas.push(c);
    return c;
  };

  // orden importa: cada cita respeta las anteriores
  // la de hoy solo se siembra si ya terminó; si es muy temprano, cae al día abierto anterior
  if(!arma('Karol Jiménez','+506 8812 4497', hoy, ['s7'], [['a1',1]], 'completada', {pref:9*60, comprobante:'0091-4471'}))
    arma('Karol Jiménez','+506 8812 4497', dPrev, ['s7'], [['a1',1]], 'completada', {pref:9*60, comprobante:'0091-4471'});
  arma('Sofía Alvarado','+506 7043 1188', dPrev, ['s1'], [], 'completada', {pref:13*60, comprobante:'0088-2210'});
  arma('Mariana Solís','+506 8604 2231', d0, ['s3'], [['a1',1]], 'aprobada', {pref:15*60, comprobante:'0102-7734'});
  arma('Gabriela Vargas','+506 6012 8890', d1, ['s1','s8'], [['a4',2]], 'aprobada', {pref:9*60, comprobante:'0103-1902'});
  arma('Daniela Rojas','+506 8399 5521', d1, ['s2'], [], 'pendiente', {pref:14*60, comprobante:'0104-6650', captura:capturaDemo()});
  arma('Andrea Mora','+506 7188 3364', d2, ['s4'], [['a2',1]], 'apartada', {pref:9*60, apartadoHasta: Date.now() + 82*60*1000});
  arma('Valeria Chaves','+506 8925 7110', d2, ['s6'], [], 'rechazada', {pref:13*60, comprobante:'0105-2288'});
}

/* ============================================================
   10. Arranque y reloj
   ============================================================ */
function pintar(){
  let dentro;
  if(V.pantalla === 'admin')        dentro = verAdmin();
  else if(V.pantalla === 'reserva') dentro = verCliente();
  else                              dentro = verInicio();
  document.getElementById('app').innerHTML =
    '<div class="marco'+(V.pantalla==='admin'?' ancho':'')+'">'+dentro+'</div>';
  marcarNav();
}

function tic(){
  const cambio = liberarExpiradas();
  // Solo se repinta si el vencimiento afecta lo que hay en pantalla; así no
  // se pierde el foco de un campo que se esté escribiendo en ese segundo.
  if(cambio && (V.pantalla === 'admin' || V.paso === 6)){
    pintar();
    return;
  }
  for(const el of document.querySelectorAll('[data-cuenta]')){
    const c = S.citas.find(x=>x.id===el.getAttribute('data-cuenta'));
    if(c) el.textContent = cuenta(c.apartadoHasta);
  }
}

(function inicio(){
  S = cargar();
  if(!S){ S = datosIniciales(); sembrar(); guardar(); }
  else {
    // completa datos que falten de versiones anteriores del archivo
    const base = datosIniciales();
    for(const k in base.config) if(S.config[k] === undefined) S.config[k] = base.config[k];
    if(!S.citas) S.citas = [];
  }
  V.admin.fecha = hoyCR();
  V.paso = 1;
  liberarExpiradas();
  pintar();
  setInterval(tic, 1000);
  window.addEventListener('scroll', marcarNav, {passive:true});
})();
</script>
